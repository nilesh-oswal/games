<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate Prep Hub</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#eef0f6; --text:#1a1e29; --muted:#5a6375; --border:#d9dde7;
  --pro:#1d4ed8; --pro-bg:#e9effd; --pro-ink:#ffffff;
  --con:#b8430c; --con-bg:#fcefe6; --con-ink:#ffffff;
  --accent:#5b3fd1; --ok:#15803d; --warn:#c0262d; --verify:#8a5a00; --verify-bg:#fdf1cc;
  --shadow:0 1px 2px rgba(15,20,40,.06),0 2px 8px rgba(15,20,40,.05);
  --radius:10px; --hh:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --panel:#181c26; --panel2:#212634; --text:#e6e9f0; --muted:#9aa3b4; --border:#2d3343;
    --pro:#86a8ff; --pro-bg:#18233f; --pro-ink:#0d1530;
    --con:#ff9f6b; --con-bg:#36200f; --con-ink:#2a1405;
    --accent:#a993ff; --ok:#4ade80; --warn:#ff7b7b; --verify:#f5c451; --verify-bg:#3a2f0e;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --panel:#181c26; --panel2:#212634; --text:#e6e9f0; --muted:#9aa3b4; --border:#2d3343;
  --pro:#86a8ff; --pro-bg:#18233f; --pro-ink:#0d1530;
  --con:#ff9f6b; --con-bg:#36200f; --con-ink:#2a1405;
  --accent:#a993ff; --ok:#4ade80; --warn:#ff7b7b; --verify:#f5c451; --verify-bg:#3a2f0e;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1{font-size:1.65rem;line-height:1.25;margin:.2rem 0 .6rem}
h2{font-size:1.15rem;margin:1.8rem 0 .7rem}
h3{font-size:1rem;margin:.2rem 0 .4rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px}
.brand{font-weight:750;letter-spacing:-.01em;font-size:1.05rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--pro) 50%,var(--con) 50%)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:6px 13px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--panel)}
.seg.sides button[data-side="pro"][aria-pressed="true"]{background:var(--pro);color:var(--pro-ink)}
.seg.sides button[data-side="con"][aria-pressed="true"]{background:var(--con);color:var(--con-ink)}
.ctl-label{font-size:.78rem;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.04em}
.ctl{display:flex;align-items:center}
#search{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 14px;width:220px}
.icon-btn{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 11px;font-size:.88rem}
.menu-btn{display:none}
#mini-timer{display:none;border:0;border-radius:999px;padding:6px 12px;font-weight:700;background:var(--accent);color:#fff;font-variant-numeric:tabular-nums}
#mini-timer.warn{background:var(--warn)}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr)}
nav#sidebar{position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow:auto;border-right:1px solid var(--border);
  background:var(--panel);padding:16px 12px 40px}
.nav-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 8px 6px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:8px;font-size:.92rem}
.nav-item:hover{background:var(--panel2)}
.nav-item[aria-current="true"]{background:var(--panel2);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .chk{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:.7rem}
.nav-item .chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.progress{margin:6px 9px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok)}
main{padding:24px 28px 80px;max-width:1120px;width:100%}
#scrim{display:none}

@media (max-width: 880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav#sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;width:285px;z-index:60;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow)}
  nav#sidebar.open{transform:none}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .menu-btn{display:inline-flex}
  #search{width:100%;order:10}
  header{padding:10px 14px}
  main{padding:18px 16px 80px}
}

/* ---------- Common blocks ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.banner{border:1px solid var(--verify);background:var(--verify-bg);color:var(--text);border-radius:var(--radius);padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.resolution{margin:10px 0 16px;padding:14px 18px;border-left:4px solid var(--accent);background:var(--panel);border-radius:0 var(--radius) var(--radius) 0;font-size:1.08rem;font-weight:550}
.means.pro{border-top:4px solid var(--pro)} .means.con{border-top:4px solid var(--con)}
.means.mine{outline:2px solid currentColor}
.means.pro.mine{color:var(--pro)} .means.con.mine{color:var(--con)}
.means.mine > *{color:var(--text)}
.tag-side{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
.tag-side.pro{background:var(--pro);color:var(--pro-ink)}
.tag-side.con{background:var(--con);color:var(--con-ink)}
.you{display:inline-block;font-size:.7rem;font-weight:800;margin-left:6px;padding:1px 7px;border-radius:99px;border:1.5px solid currentColor}
ul.tight{margin:.3rem 0;padding-left:1.2rem} ul.tight li{margin:.25rem 0}
.outline-step{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)}
.outline-step:last-child{border-bottom:0}
.outline-step .when{font-weight:700} .outline-step .when span{display:block;font-weight:500;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
@media (max-width:600px){.outline-step{grid-template-columns:1fr;gap:2px}}
.sub-tile{text-align:left;border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.sub-tile:hover{border-color:var(--accent)}
.sub-tile h3{display:flex;justify-content:space-between;gap:6px}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{padding:11px 22px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.mini{padding:3px 9px;font-size:.78rem;border-radius:99px}
.btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.crumbs{font-size:.85rem;color:var(--muted)} .crumbs button{border:0;background:none;color:var(--accent);padding:0;font-size:inherit}

/* ---------- Terms ---------- */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.term{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.term b{display:block;margin-bottom:2px}

/* ---------- Clash cards ---------- */
.clash{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}
.clash-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--panel2);font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.clash-grid{display:grid;grid-template-columns:1fr 1fr}
.side{padding:14px 16px;position:relative}
.side.pro{background:var(--pro-bg);border-left:4px solid var(--pro)}
.side.con{background:var(--con-bg);border-left:4px solid var(--con)}
.side.other{filter:saturate(.75);opacity:.92}
.side.mine.pro{box-shadow:inset 0 0 0 2px var(--pro)}
.side.mine.con{box-shadow:inset 0 0 0 2px var(--con)}
.side .lbl{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.side.pro .lbl{color:var(--pro)} .side.con .lbl{color:var(--con)}
.side .claim{font-weight:560}
.side .ev{font-size:.86rem;color:var(--muted);margin-top:8px}
.side .ev b{color:var(--text);font-weight:650}
.role{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
@media (max-width:720px){.clash-grid{grid-template-columns:1fr}}
details{border-top:1px solid var(--border)}
details > summary{cursor:pointer;padding:10px 16px;font-weight:650;font-size:.9rem;list-style:none}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}
details[open] > summary::before{transform:rotate(90deg)}
.counters{padding:0 16px 14px;display:grid;gap:8px}
.counter{padding:8px 12px;border-radius:8px;font-size:.9rem}
.counter.pro{background:var(--pro-bg);border-left:3px solid var(--pro)}
.counter.con{background:var(--con-bg);border-left:3px solid var(--con)}

/* ---------- Cross-ex ---------- */
.xcol h3{display:flex;align-items:center;gap:8px}
.xq{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.xq > summary{font-weight:560}
.xq .fu{padding:0 16px 12px;font-size:.9rem}
.xq .fu p{margin:.3rem 0}

/* ---------- Evidence ---------- */
table.ev{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:.9rem}
table.ev th,table.ev td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.ev th{background:var(--panel2);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.ev tr:last-child td{border-bottom:0}
.badge{display:inline-block;font-size:.72rem;font-weight:750;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.verify{background:var(--verify-bg);color:var(--verify);border:1px solid var(--verify)}
@media (max-width:640px){
  table.ev thead{display:none}
  table.ev tr{display:block;border-bottom:1px solid var(--border);padding:8px 0}
  table.ev td{display:block;border:0;padding:3px 12px}
}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.subnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* ---------- Simulator ---------- */
.draw-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
@media (max-width:640px){.draw-stage{grid-template-columns:1fr}}
.draw-box{text-align:center;padding:22px 14px;border:2px dashed var(--border);border-radius:var(--radius);background:var(--panel)}
.draw-box .big{font-size:1.4rem;font-weight:800;margin-top:6px}
.draw-box.spin .big{opacity:.6}
.coin{width:84px;height:84px;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:#fff;background:var(--muted)}
.coin.pro{background:var(--pro);color:var(--pro-ink)} .coin.con{background:var(--con);color:var(--con-ink)}
.coin.flipping{animation:flip .25s linear infinite}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
.timer-wrap{text-align:center;padding:24px 16px}
.seg-name{font-size:1.15rem;font-weight:750}
.seg-who{color:var(--muted);margin-top:2px}
.clock{font-size:clamp(3.2rem,12vw,5.6rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:10px 0}
.clock.warn{color:var(--warn);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 auto 18px;max-width:520px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.seglist{list-style:none;padding:0;margin:0}
.seglist li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;font-size:.92rem}
.seglist li.cur{background:var(--panel2);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.seglist li.done{color:var(--muted);text-decoration:line-through}
.seglist .who-pro{color:var(--pro);font-weight:700} .seglist .who-con{color:var(--con);font-weight:700}
.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:.8rem;background:var(--panel2)}

/* ---------- Flashcards ---------- */
.fc-wrap{max-width:680px;margin:0 auto}
.fc{perspective:1200px;cursor:pointer;margin:14px 0}
.fc-inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--border);
  background:var(--panel);box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-face .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
.fc-face .txt{font-size:1.12rem;font-weight:560}
.fc-face.pro{border-top:5px solid var(--pro)} .fc-face.con{border-top:5px solid var(--con)} .fc-face.term{border-top:5px solid var(--accent)}
.fc-stats{display:flex;gap:14px;justify-content:center;font-size:.88rem;color:var(--muted);flex-wrap:wrap}

/* ---------- Rubric ---------- */
.rub{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:start}
.rub-item{border-bottom:1px solid var(--border);padding:14px 0}
.rub-item:last-child{border-bottom:0}
.w{font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel2);margin-left:6px}
.w.x2{background:var(--accent);color:#fff}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin:5px 0}
.check input{margin-top:4px}
.score-sel{padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2)}
.total{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- Reference sheet ---------- */
.sheet-cols{display:grid;grid-template-columns:1fr;gap:18px}
.sheet-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.sheet-controls{grid-template-columns:1fr}}
.pick-group{margin-bottom:10px}
.pick-group > summary{padding:8px 4px}
.pick{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;padding:5px 4px}
.pick input{margin-top:3px}
textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:9px 11px;resize:vertical}
.paper-wrap{background:var(--panel2);border-radius:var(--radius);padding:14px;overflow-x:auto}
.paper{width:7.5in;background:#fff;color:#111;font-size:9pt;line-height:1.28;padding:0;box-shadow:0 0 0 12px #fff,0 2px 14px rgba(0,0,0,.18);margin:12px}
.paper h1{font-size:12pt;margin:0 0 2pt} .paper h2{font-size:10pt;margin:7pt 0 3pt;border-bottom:1px solid #999;padding-bottom:1pt}
.paper .res{font-style:italic;margin:0 0 4pt}
.paper .it{margin:0 0 4pt} .paper .it b{font-weight:700}
.paper .src{color:#444}
.paper .note{white-space:pre-wrap}
.est{font-weight:700} .est.bad{color:var(--warn)} .est.good{color:var(--ok)}

/* ---------- Search ---------- */
.hit{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.hit:hover{border-color:var(--accent)}
.hit .where{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Learn mode ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:12px 0 20px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs .dot-done{color:var(--ok);margin-left:4px}
.lesson{max-width:760px;font-size:1.05rem;line-height:1.75}
.lesson h2{font-size:1.2rem;margin:2rem 0 .5rem}
.lesson p{margin:.6rem 0}
.lesson ul{padding-left:1.3rem;margin:.5rem 0} .lesson li{margin:.35rem 0}
.read-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.read-meta span{background:var(--panel2);border-radius:99px;padding:3px 11px}
.hook{font-size:1.17rem;line-height:1.65;padding:18px 20px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel));border:1px solid var(--border)}
.tldr{margin:16px 0;padding:12px 16px;border-left:4px solid var(--ok);background:var(--panel);border-radius:0 10px 10px 0}
.tldr b{color:var(--ok)}
.callout{display:flex;gap:14px;align-items:flex-start;margin:22px 0;padding:14px 18px;border-radius:12px;border:1px solid var(--border);background:var(--panel)}
.callout .ico{font-size:1.6rem;line-height:1}
.callout h4{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.callout.analogy{border-left:5px solid var(--accent)}
.callout.fact{border-left:5px solid var(--verify);background:var(--verify-bg)}
.wtk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;font-size:.95rem}
.wtk div{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;line-height:1.5}
.qc{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;border-top:1px solid var(--border)}
.qc > summary{font-weight:600}
.qc > summary .reveal{float:right;font-size:.78rem;color:var(--accent);font-weight:700}
.qc[open] > summary .reveal{display:none}
.qc .ans{padding:0 16px 14px;color:var(--ok);font-weight:550}
.next-box{margin:28px 0 8px;padding:18px 20px;border-radius:12px;background:var(--panel);border:2px dashed var(--accent);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.figure{margin:20px 0;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.figure svg{width:100%;height:auto;display:block}
@media (max-width:640px){.figure{overflow-x:auto}.figure svg{min-width:620px}}
.figure figcaption{font-size:.9rem;color:var(--muted);margin-top:8px}
.svg-t{fill:var(--text);font:600 13px system-ui,sans-serif}
.svg-m{fill:var(--muted);font:12px system-ui,sans-serif}
.svg-w{fill:#fff;font:600 12px system-ui,sans-serif}
.svg-line{stroke:var(--muted);stroke-width:1}
.path-list{list-style:none;padding:0;margin:0;counter-reset:step}
.path-list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.path-list li:last-child{border-bottom:0}
.path-list .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--panel2)}
.path-list li.ok .n{background:var(--ok);color:#fff}
.nav-item .chk.read{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.start-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--accent)}

/* ---------- Speeches ---------- */
.sp-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sp-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin:18px 0;overflow:hidden}
.sp-card > .bar-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--panel2);border-bottom:1px solid var(--border)}
.sp-card > .bar-top h2{margin:0;font-size:1.08rem}
.sp-body{padding:6px 18px 14px}
.sp-stats{font-size:.82rem;color:var(--muted)}
.sp-stats b.over{color:var(--warn)} .sp-stats b.okk{color:var(--ok)}
.sp-seg{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
.sp-seg:last-child{border-bottom:0}
.sp-seg .lab{font-weight:750;font-size:.86rem}
.sp-seg .lab span{display:block;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.sp-text{font-size:1.04rem;line-height:1.7}
@media (max-width:640px){.sp-seg{grid-template-columns:1fr;gap:2px}}
.rb{border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
.rb.off{opacity:.55}
.rb-head{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel2);font-size:.86rem}
.rb-head input{width:17px;height:17px}
.rb-body{padding:10px 14px}
.pt{display:inline-flex;align-items:center;gap:6px}
.pt .clk{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:center;padding:4px 10px;border-radius:8px;background:var(--panel)}
.pt .clk.warn{color:var(--warn)}
.pt .clk.done{color:#fff;background:var(--warn)}
.readthru{max-width:780px;font-size:1.22rem;line-height:1.85}
.readthru .rt-lab{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.readthru p{margin:.2rem 0 .6rem}
.rt-bar{position:sticky;top:var(--hh);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px}
.cxd{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.cxd .fu{padding:0 16px 12px}
.src-list{list-style:none;padding:0;margin:0}
.src-list li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.src-list li:last-child{border-bottom:0}

/* ---------- Print ---------- */
@media print{
  @page{size:letter;margin:0.5in}
  body{background:#fff;color:#000}
  header,nav#sidebar,#scrim,.no-print{display:none !important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .paper-wrap{background:none;padding:0;overflow:visible}
  .paper{width:auto;box-shadow:none;margin:0}
}
</style>
</head>

  get(k, def){ try{ const v = localStorage.getItem("dph:" + k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem("dph:" + k, JSON.stringify(v)); } catch(e){ /* storage unavailable: keep working in memory */ } }
};

/* ---------- State ---------- */
const state = {
  topic: store.get("topic", 0),
  side: store.get("side", "pro"),
  view: store.get("view", "primer"),
  tab: store.get("tab", "learn"),
  sub: store.get("sub", null),
  theme: store.get("theme", "auto"),
  query: "",
  scope: store.get("fcScope", "topic")
};
if (!(state.topic >= 0 && state.topic < DATA.topics.length)) state.topic = 0;
if (state.side !== "pro" && state.side !== "con") state.side = "pro";
if (!["primer","overview","sub","sim","cards","rubric","sheet","speeches"].includes(state.view)) state.view = "primer";
if (state.tab !== "learn" && state.tab !== "prep") state.tab = "learn";
if (state.view === "sub" && !findSub(state.topic, state.sub)) state.view = "overview";

let reviewed = store.get("reviewed", {});
let readDone = store.get("read", {});
let spSel = store.get("spSel", {});
let spRead = false;
let cardProg = store.get("cards", {});
let rubric = store.get("rubric", { scores:{}, ticks:{}, history:[] });
if (!rubric.scores) rubric.scores = {}; if (!rubric.ticks) rubric.ticks = {}; if (!rubric.history) rubric.history = [];
let sheets = store.get("sheets", {});

/* ---------- Helpers ---------- */
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.from((el || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function T(){ return DATA.topics[state.topic]; }
function findSub(ti, sid){ const t = DATA.topics[ti]; return t ? t.subtopics.find(s => s.id === sid) : null; }
function other(side){ return side === "pro" ? "con" : "pro"; }
function SIDE(s){ return s.toUpperCase(); }
function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function rkey(t, s){ return t.id + "|" + s.id; }
function save(){ store.set("topic", state.topic); store.set("side", state.side); store.set("view", state.view); store.set("sub", state.sub); store.set("tab", state.tab); }
function lessonFor(t, s){ return (LEARN[t.id] || {})[s.id] || null; }
function defaultTab(t, sid){ const s = t.subtopics.find(x => x.id === sid); return s && readDone[rkey(t, s)] ? "prep" : "learn"; }
function stripTags(h){ return String(h).replace(/<[^>]+>/g, ""); }
function sheetFor(t){ if (!sheets[t.id]) sheets[t.id] = { items:[], notes:"", ai: DEFAULT_AI_NOTE }; return sheets[t.id]; }
function saveSheets(){ store.set("sheets", sheets); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function tagBadge(tag){ return tag === "ok" ? '<span class="badge ok">well-established</span>' : '<span class="badge verify">VERIFY BEFORE USING</span>'; }

/* ---------- Theme ---------- */
function applyTheme(){
  const r = document.documentElement;
  if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  $("#theme-btn").textContent = state.theme === "auto" ? "◐ Auto" : state.theme === "light" ? "☀ Light" : "☾ Dark";
}

/* ---------- Header ---------- */
function renderHeader(){
  $("#topic-seg").innerHTML = DATA.topics.map((t, i) =>
    `<button data-action="topic" data-i="${i}" aria-pressed="${i === state.topic}" title="${esc(t.short)}">${esc(t.label)}<span class="hide-sm">: ${esc(t.short)}</span></button>`).join("");
  $$('[data-action="side"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.side === state.side)));
  const hh = $("#hdr").offsetHeight; document.documentElement.style.setProperty("--hh", hh + "px");
}

/* ---------- Sidebar ---------- */
function renderSidebar(){
  const t = T();
  const done = t.subtopics.filter(s => reviewed[rkey(t, s)]).length;
  const pct = Math.round(done / t.subtopics.length * 100);
  const item = (view, label, extra, cur) =>
    `<button class="nav-item" data-action="go" data-view="${view}" ${extra || ""} aria-current="${cur}">${label}</button>`;
  const nRead = t.subtopics.filter(s => readDone[rkey(t, s)]).length;
  let h = `<div class="nav-title">${esc(t.label)}: ${esc(t.short)}</div>`;
  h += item("primer", "📘 Start here: the basics", "", state.view === "primer");
  h += item("overview", "★ Topic overview", "", state.view === "overview");
  h += `<div class="progress" title="${done} of ${t.subtopics.length} reviewed"><span style="width:${pct}%"></span></div>
        <div class="small muted" style="margin:0 9px 6px">${nRead}/${t.subtopics.length} lessons read · ${done} reviewed</div>`;
  t.subtopics.forEach(s => {
    const d = !!reviewed[rkey(t, s)], r = !!readDone[rkey(t, s)];
    h += item("sub", `<span class="chk ${d ? "done" : r ? "read" : ""}" title="${d ? "Reviewed" : r ? "Lesson read" : "Not started"}">${d ? "✓" : r ? "•" : ""}</span><span>${esc(s.title)}</span>`,
      `data-sub="${esc(s.id)}"`, state.view === "sub" && state.sub === s.id);
  });
  h += `<div class="nav-title">Practice</div>`;
  h += item("speeches", "🎤 Model speeches", "", state.view === "speeches");
  h += item("sim", "⏱ Round Simulator", "", state.view === "sim");
  h += item("cards", "🗂 Flashcards", "", state.view === "cards");
  h += item("rubric", "✅ Rubric & self-check", "", state.view === "rubric");
  h += item("sheet", "📄 Reference Sheet Builder", "", state.view === "sheet");
  h += `<div class="nav-title">Shortcuts</div>
        <div class="small muted" style="margin:0 9px 8px;line-height:1.6">Circle key: <span style="color:var(--accent)">•</span> lesson read · <span style="color:var(--ok)">✓</span> debate prep reviewed</div>
        <div class="small muted" style="margin:0 9px;line-height:1.7"><span class="kbd">/</span> search · <span class="kbd">Space</span> start/pause timer<br><span class="kbd">←</span><span class="kbd">→</span> flashcard again/got it · <span class="kbd">↑</span> flip</div>`;
  $("#sidebar").innerHTML = h;
}

/* ---------- Router ---------- */
function render(){
  renderHeader(); renderSidebar();
  const m = $("#main");
  if (state.query.trim().length >= 2) { m.innerHTML = renderSearch(state.query.trim()); updateMini(); return; }
  switch (state.view){
    case "primer": m.innerHTML = renderPrimer(T()); break;
    case "sub": m.innerHTML = renderSub(T(), findSub(state.topic, state.sub)); break;
    case "sim": m.innerHTML = renderSim(); break;
    case "speeches": m.innerHTML = renderSpeeches(); break;
    case "cards": m.innerHTML = renderCards(); break;
    case "rubric": m.innerHTML = renderRubric(); break;
    case "sheet": m.innerHTML = renderSheet(); estimateSheet(); break;
    default: m.innerHTML = renderOverview(T());
  }
  updateMini();
}
function go(view, sub, anchor, tab){
  if (view !== "speeches") spRead = false;
  state.view = view; if (sub !== undefined) state.sub = sub;
  if (view === "sub") state.tab = tab || defaultTab(T(), state.sub);
  state.query = ""; $("#search").value = "";
  save(); closeMenu(); render();
  if (anchor){ const el = document.getElementById(anchor); if (el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); el.classList.add("flash"); } }
  else window.scrollTo(0, 0);
}

/* ---------- Overview ---------- */
function renderOverview(t){
  const me = state.side, op = other(me);
  const meansCard = s => `<div class="card means ${s} ${s === me ? "mine" : ""}">
      <h3><span class="tag-side ${s}">${SIDE(s)}</span> ${s === "pro" ? "affirms the resolution" : "negates the resolution"}${s === me ? '<span class="you">YOUR VIEW</span>' : ""}</h3>
      <p>${esc(s === "pro" ? t.proMeans : t.conMeans)}</p></div>`;
  const topCard = s => `<div class="card"><h3><span class="tag-side ${s}">${SIDE(s)}</span> strongest arguments</h3>
      <ol class="tight">${(s === "pro" ? t.overview.proTop : t.overview.conTop).map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
  const thesisCard = s => `<div class="card"><h3><span class="tag-side ${s}">${SIDE(s)}</span> thesis template</h3>
      <p>${esc(s === "pro" ? t.overview.proThesis : t.overview.conThesis)}</p></div>`;
  return `
  <div class="banner"><b>Heads up:</b> this content was drafted with AI help and is current to about 2025. Anything tagged <span class="badge verify">VERIFY BEFORE USING</span> must be checked against a real source before it goes on your reference sheet or into a speech. You have to be able to defend every argument you use.</div>
  ${t.subtopics.some(s => !readDone[rkey(t, s)]) ? `<div class="start-cta"><span><b>New to this topic?</b> Read the basics and the short lessons first. Debate prep makes much more sense after.</span><button class="btn primary" data-action="go" data-view="primer">📘 Start here</button></div>` : ""}
  <div class="eyebrow">${esc(t.label)} · overview</div>
  <h1>${esc(t.short)}</h1>
  <div class="resolution">“${esc(t.resolution)}”</div>
  <div class="grid2">${meansCard(me)}${meansCard(op)}</div>
  <h2>The 3 strongest arguments on each side</h2>
  <div class="grid2">${topCard(me)}${topCard(op)}</div>
  <h2>One-sentence thesis templates</h2>
  <p class="muted small">Fill the [brackets] with your three points. Say it word for word in your opening.</p>
  <div class="grid2">${thesisCard(me)}${thesisCard(op)}</div>
  <h2>2-minute opening outline <span class="tag-side ${me}">${SIDE(me)}</span></h2>
  <p class="muted small">Switch <b>View as</b> in the header to see the ${SIDE(op)} outline.</p>
  <div class="card">${t.overview.outline[me].map(o => `<div class="outline-step"><div class="when">${esc(o.part)}<span>${esc(o.time)}</span></div><div>${esc(o.text)}</div></div>`).join("")}</div>
  <p style="margin-top:10px"><button class="btn primary" data-action="go" data-view="speeches">🎤 Read the full model ${SIDE(me)} speech →</button></p>
  <h2>Subtopics</h2>
  <div class="grid3">${t.subtopics.map((s, i) => {
      const d = !!reviewed[rkey(t, s)];
      return `<button class="sub-tile" data-action="go" data-view="sub" data-sub="${esc(s.id)}">
        <h3><span>${i + 1}. ${esc(s.title)}</span>${d ? '<span class="badge ok">✓ reviewed</span>' : ""}</h3>
        <p class="small muted">${esc(s.summary.split(". ")[0])}.</p>
        <p class="small muted">${s.clashes.length} clash cards · ${s.crossEx.pro.length + s.crossEx.con.length} cross-ex questions</p></button>`;
    }).join("")}</div>`;
}

/* ---------- Subtopic ---------- */
function sideBox(c, s, role){
  const me = state.side;
  return `<div class="side ${s} ${s === me ? "mine" : "other"}">
     <div class="lbl"><span class="tag-side ${s}">${SIDE(s)}</span><span class="role">${role}</span>${s === me ? '<span class="you">YOU</span>' : ""}</div>
     <p class="claim">${esc(s === "pro" ? c.pro : c.con)}</p>
     <p class="ev"><b>Evidence:</b> ${esc(s === "pro" ? c.proEv : c.conEv)}</p></div>`;
}
function clashHTML(t, s, c, i){
  const order = state.side === "pro" ? ["pro", "con"] : ["con", "pro"];
  const role = x => x === "pro"
    ? (state.side === "con" ? "Their claim · you answer this" : "Claim")
    : (state.side === "con" ? "Your direct response" : "Direct response");
  const id = `cl:${t.id}:${s.id}:${i}`;
  const on = sheetFor(t).items.includes(id);
  return `<article class="clash" id="clash-${i}">
    <div class="clash-head"><span>Clash ${i + 1}</span>
      <button class="btn mini ${on ? "on" : ""}" data-action="sheet-toggle" data-id="${id}">${on ? "✓ On sheet" : "+ Add to sheet"}</button></div>
    <div class="clash-grid">${order.map(x => sideBox(c, x, role(x))).join("")}</div>
    <details><summary>Rebuttal counters (one-liners)</summary>
      <div class="counters">${order.map(x => `<div class="counter ${x}"><b>${SIDE(x)} counter:</b> ${esc(x === "pro" ? c.proCounter : c.conCounter)}</div>`).join("")}</div>
    </details></article>`;
}
function xqHTML(q, i, side, mine){
  return `<details class="xq" id="xq-${side}-${i}"><summary>${esc(q.q)}</summary>
    <div class="fu">${mine
      ? `<p><b>If they say:</b> “${esc(q.ifSay)}”</p><p><b>Follow up:</b> “${esc(q.then)}”</p>`
      : `<p><b>Trap to avoid:</b> if you answer “${esc(q.ifSay)}”, expect: “${esc(q.then)}”</p><p class="muted small">Prepare a fuller answer with a source so the follow-up doesn't land.</p>`}
    </div></details>`;
}
function renderSub(t, s){
  if (!s) return renderOverview(t);
  const idx = t.subtopics.indexOf(s);
  const prev = t.subtopics[idx - 1], next = t.subtopics[idx + 1];
  const me = state.side, op = other(me);
  const d = !!reviewed[rkey(t, s)];
  const sh = sheetFor(t);
  const L = lessonFor(t, s), r = !!readDone[rkey(t, s)];
  const head = `
  <div class="crumbs"><button data-action="go" data-view="overview">${esc(t.label)}: ${esc(t.short)}</button> › Subtopic ${idx + 1} of ${t.subtopics.length}</div>
  <h1>${esc(s.title)}</h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-action="tab" data-tab="learn" aria-selected="${state.tab === "learn"}">📖 Learn${r ? '<span class="dot-done">✓</span>' : ""}</button>
    <button role="tab" data-action="tab" data-tab="prep" aria-selected="${state.tab === "prep"}">⚔️ Debate prep${d ? '<span class="dot-done">✓</span>' : ""}</button>
  </div>`;
  if (state.tab === "learn" && L) return head + renderLesson(t, s, L, idx);
  return head + `
  <p>${esc(s.summary)}</p>
  <h2 id="terms">Key terms</h2>
  <div class="terms">${s.terms.map(x => `<div class="term"><b>${esc(x.t)}</b>${esc(x.d)}</div>`).join("")}</div>
  <h2>Clash cards</h2>
  <p class="muted small">Each card pairs a Pro claim with the Con response that answers it directly. You're viewing as <span class="tag-side ${me}">${SIDE(me)}</span>, so your side is on the left and outlined.</p>
  ${s.clashes.map((c, i) => clashHTML(t, s, c, i)).join("")}
  <h2>Cross-examination bank</h2>
  <div class="grid2">
    <div class="xcol"><h3><span class="tag-side ${me}">${SIDE(me)}</span> Questions you ask</h3>${s.crossEx[me].map((q, i) => xqHTML(q, i, me, true)).join("")}</div>
    <div class="xcol"><h3><span class="tag-side ${op}">${SIDE(op)}</span> Questions to prepare for</h3>${s.crossEx[op].map((q, i) => xqHTML(q, i, op, false)).join("")}</div>
  </div>
  <h2>Evidence</h2>
  <table class="ev"><thead><tr><th>Claim</th><th>Source</th><th>Confidence</th><th></th></tr></thead><tbody>
  ${s.evidence.map((e, i) => { const id = `ev:${t.id}:${s.id}:${i}`; const on = sh.items.includes(id);
     return `<tr id="ev-${i}"><td>${esc(e.claim)}</td><td>${esc(e.source)}</td><td>${tagBadge(e.tag)}</td>
       <td><button class="btn mini ${on ? "on" : ""}" data-action="sheet-toggle" data-id="${id}">${on ? "✓ On sheet" : "+ Sheet"}</button></td></tr>`; }).join("")}
  </tbody></table>
  <div class="subnav">
    ${prev ? `<button class="btn" data-action="go" data-view="sub" data-sub="${esc(prev.id)}">← ${esc(prev.title)}</button>` : `<button class="btn" data-action="go" data-view="overview">← Overview</button>`}
    <button class="btn ${d ? "on" : "primary"}" data-action="review" data-sub="${esc(s.id)}">${d ? "✓ Reviewed (undo)" : "Mark as reviewed"}</button>
    ${next ? `<button class="btn" data-action="go" data-view="sub" data-sub="${esc(next.id)}">${esc(next.title)} →</button>` : `<button class="btn" data-action="go" data-view="cards">Flashcards →</button>`}
  </div>`;
}

/* ---------- Lessons ---------- */
function lessonWords(L){
  let txt = (L.hook || "") + " " + (L.tldr || "") + " " + ((L.analogy || {}).text || "") + " " + (L.fact || "");
  (L.sections || []).forEach(x => { txt += " " + (x.p || []).join(" ") + " " + (x.list || []).join(" "); });
  return stripTags(txt).split(/\s+/).length;
}
function sectionHTML(x, i){
  return `<h2 id="lesson-sec-${i}">${x.h}</h2>${(x.p || []).map(p => `<p>${p}</p>`).join("")}${x.list ? `<ul>${x.list.map(li => `<li>${li}</li>`).join("")}</ul>` : ""}`;
}
function renderLesson(t, s, L, idx){
  const mins = Math.max(2, Math.round(lessonWords(L) / 180));
  const next = t.subtopics[idx + 1];
  const r = !!readDone[rkey(t, s)];
  let body = "";
  L.sections.forEach((x, i) => {
    body += sectionHTML(x, i);
    if (i === 1 && L.analogy) body += `<div class="callout analogy"><div class="ico">💡</div><div><h4>${esc(L.analogy.title)}</h4>${L.analogy.text}</div></div>`;
    if (i === Math.min(3, L.sections.length - 2) && L.fact) body += `<div class="callout fact"><div class="ico">🤯</div><div><h4>Did you know?</h4>${L.fact}</div></div>`;
  });
  return `<div class="lesson">
    <div class="read-meta"><span>📖 Lesson ${idx + 1} of ${t.subtopics.length}</span><span>⏱ about ${mins} min</span>${r ? '<span style="color:var(--ok)">✓ read</span>' : ""}</div>
    <div class="hook">${L.hook}</div>
    <div class="tldr"><b>The big idea:</b> ${L.tldr}</div>
    ${body}
    <h2>Words to know</h2>
    <div class="wtk">${s.terms.map(x => `<div><b>${esc(x.t)}</b>: ${esc(x.d)}</div>`).join("")}</div>
    <h2>Check yourself</h2>
    <p class="muted small">Try to answer out loud before you reveal. That's what makes it stick.</p>
    ${L.check.map((q, i) => `<details class="qc" id="qc-${i}"><summary>${esc(q.q)} <span class="reveal">Show answer</span></summary><div class="ans">${esc(q.a)}</div></details>`).join("")}
    <div class="next-box">
      <span><b>${r ? "Nice, you've read this one." : "Finished reading?"}</b><br><span class="small muted">Next: see how debaters use this in clash cards and cross-examination.</span></span>
      <div class="row">
        <button class="btn primary" data-action="lesson-done" data-sub="${esc(s.id)}">${r ? "Go to debate prep →" : "✓ I've read this: go to debate prep"}</button>
        ${next ? `<button class="btn" data-action="go" data-view="sub" data-sub="${esc(next.id)}" data-tab="learn">Next lesson: ${esc(next.title)} →</button>` : ""}
      </div>
    </div>
  </div>`;
}
function diagramOrbits(){

    <text class="svg-t" x="48" y="160" text-anchor="middle">Earth</text>

                     : `<circle cx="${X}" cy="105" r="6" fill="var(--accent)"/>`}

        <text class="svg-m" x="${X}" y="${yT}" text-anchor="middle">${m.sub}</text>`;

function diagramOcean(){
  const y = m => 40 + m * 0.0538;
  const zones = [
    { a:0, b:200, fill:"#7cc4f0", name:"Sunlight zone", sub:"0–200 m · plants & most sea life" },
    { a:200, b:1000, fill:"#3f8fc9", name:"Twilight zone", sub:"200–1,000 m · dim · huge numbers of fish" },
    { a:1000, b:4000, fill:"#1d4e86", name:"Midnight zone", sub:"1,000–4,000 m · no sunlight at all" },
    { a:4000, b:6000, fill:"#0d2546", name:"Abyss", sub:"4,000–6,000 m · near freezing, crushing pressure" }
  ];
  const labelY = [50, 84, 174, 300];

/* ---------- Model speeches ---------- */
const WPM = 145;

function mmss(sec){ sec = Math.round(sec); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function spSelected(t, side){
  const k = t.id + "|" + side, sp = SPEECHES[t.id][side];

/* ---------- Round Simulator ---------- */
const sim = { drawn:null, idx:0, remaining:SEGMENTS[0].dur, running:false, endAt:0, drawing:false };

function beep(){
  const a = audio(); if (!a) return;
  try{
    [0, 0.28, 0.56].forEach(off => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      const t0 = a.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.start(t0); o.stop(t0 + 0.25);
    });
  } catch(e){}
}
function simDraw(){

}

}

function simToggle(){ sim.running ? simPause() : simStart(); }
function simSkip(){

/* ---------- Flashcards ---------- */
function buildDeck(scope){
  const cards = [];
  DATA.topics.forEach((t, ti) => {
    if (scope === "topic" && ti !== state.topic) return;
    t.subtopics.forEach(s => {
      s.terms.forEach((x, i) => cards.push({ id:`t:${t.id}:${s.id}:${i}`, kind:"term", where:`${t.short} › ${s.title}`,
        fk:"Key term: define it", front:x.t, bk:"Definition", back:x.d }));
      const L = lessonFor(t, s);
      if (L) L.check.forEach((q, i) => cards.push({ id:`q:${t.id}:${s.id}:${i}`, kind:"term", where:`${t.short} › ${s.title}`,
        fk:"Quick check", front:q.q, bk:"Answer", back:q.a }));
      s.clashes.forEach((c, i) => {
        cards.push({ id:`a:${t.id}:${s.id}:${i}`, kind:"pro", where:`${t.short} › ${s.title}`,
          fk:"PRO claims… what is the CON response?", front:c.pro, bk:"CON response", back:c.con + "  (Evidence: " + c.conEv + ")", backKind:"con" });
        cards.push({ id:`b:${t.id}:${s.id}:${i}`, kind:"con", where:`${t.short} › ${s.title}`,
          fk:"CON responds… how does PRO counter?", front:c.con, bk:"PRO counter", back:c.proCounter, backKind:"pro" });
      });
    });
  });
  return cards;
}
let fc = null; // { scope, deck:Map, queue:[ids], flipped }
function fcInit(reshuffle){
  const deck = buildDeck(state.scope);
  const map = new Map(deck.map(c => [c.id, c]));
  const boxes = {};
  deck.forEach(c => { const b = (cardProg[c.id] || {}).box || 0; (boxes[b] = boxes[b] || []).push(c.id); });
  let queue = [];
  Object.keys(boxes).map(Number).sort((a, b) => a - b).forEach(b => { queue = queue.concat(shuffle(boxes[b])); });
  if (reshuffle) queue = shuffle(queue);
  fc = { scope: state.scope, topic: state.topic, deck: map, queue, flipped: false, seen: 0 };
}
function fcAnswer(got){
  if (!fc || !fc.queue.length) return;
  const id = fc.queue.shift();
  const p = cardProg[id] || { box:0 };
  if (got){ p.box = Math.min(4, (p.box || 0) + 1); }
  else { p.box = 0; fc.queue.splice(Math.min(3, fc.queue.length), 0, id); } // comes back after ~3 cards
  cardProg[id] = p; store.set("cards", cardProg);
  fc.flipped = false; fc.seen++;
  render();
}
function fcFlip(){ if (!fc) return; fc.flipped = !fc.flipped; const el = $("#fc"); if (el) el.classList.toggle("flipped", fc.flipped); }
function renderCards(){
  if (!fc || fc.scope !== state.scope || (state.scope === "topic" && fc.topic !== state.topic)) fcInit(false);
  const total = fc.deck.size;
  const mastered = Array.from(fc.deck.keys()).filter(id => ((cardProg[id] || {}).box || 0) >= 3).length;
  let h = `<div class="eyebrow">Practice</div><h1>Flashcards</h1>
    <p class="muted">Active recall: read the front, answer out loud, then flip. Cards you mark <b>Review again</b> come back within a few cards; cards you get right move up and appear less often.</p>
    <div class="row no-print" style="margin:10px 0">
      <div class="seg" role="group" aria-label="Deck">
        <button data-action="fc-scope" data-scope="topic" aria-pressed="${state.scope === "topic"}">This topic</button>
        <button data-action="fc-scope" data-scope="all" aria-pressed="${state.scope === "all"}">Both topics</button></div>
      <button class="btn" data-action="fc-shuffle">🔀 Shuffle</button>
      <button class="btn" data-action="fc-reset">↺ Reset progress</button></div>
    <div class="fc-stats"><span>${fc.queue.length} left this session</span><span>${mastered}/${total} mastered</span><span>${fc.seen} answered</span></div>`;
  if (!fc.queue.length){
    return h + `<div class="card" style="text-align:center;margin-top:16px"><h3>Deck complete 🎉</h3><p class="muted">Shuffle to go again, or switch decks.</p>
      <button class="btn primary" data-action="fc-shuffle">Go again</button></div>`;
  }
  const c = fc.deck.get(fc.queue[0]);
  return h + `<div class="fc-wrap">
    <div class="fc ${fc.flipped ? "flipped" : ""}" id="fc" data-action="fc-flip" role="button" tabindex="0" aria-label="Flashcard, click to flip">
      <div class="fc-inner">
        <div class="fc-face ${c.kind}"><div class="k">${esc(c.fk)}</div><div class="txt">${esc(c.front)}</div><div class="small muted" style="margin-top:12px">${esc(c.where)}</div></div>
        <div class="fc-face fc-back ${c.backKind || "term"}"><div class="k">${esc(c.bk)}</div><div class="txt">${esc(c.back)}</div></div>
      </div></div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-action="fc-again">← Review again</button>
      <button class="btn" data-action="fc-flip">↑ Flip</button>
      <button class="btn primary" data-action="fc-got">Got it →</button></div></div>`;
}

/* ---------- Rubric ---------- */
function rubricTotal(){ return RUBRIC.reduce((sum, r) => sum + (Number(rubric.scores[r.id]) || 0) * r.weight, 0); }
function renderRubric(){
  const total = rubricTotal();
  const allScored = RUBRIC.every(r => rubric.scores[r.id]);
  return `<div class="eyebrow">Practice</div><h1>Rubric & self-check</h1>
  <p class="muted">The judges score 9 categories from 1–10; two of them count double, for 110 points total. After a practice round, tick what you did and give yourself an honest score.</p>
  <div class="grid2" style="margin:14px 0">
    <div class="card"><div class="eyebrow">Your practice score</div><div class="total">${total} <span class="muted" style="font-size:1rem">/ 110</span></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-action="rub-save" ${allScored ? "" : "disabled"}>Save this round</button>
      <button class="btn" data-action="rub-clear">Clear for new round</button></div>
      ${allScored ? "" : '<p class="small muted">Score every category to save the round.</p>'}</div>
    <div class="card"><div class="eyebrow">Recent rounds</div>
      ${rubric.history.length ? `<ul class="tight small">${rubric.history.slice(-8).reverse().map(r => `<li>${esc(r.date)} · ${esc(r.topic)} · <span class="tag-side ${r.side}">${SIDE(r.side)}</span> · <b>${r.total}</b>/110</li>`).join("")}</ul>` : '<p class="small muted">No rounds saved yet.</p>'}</div>
  </div>
  <div class="card">${RUBRIC.map(r => `<div class="rub-item"><div class="rub">
      <div><h3>${esc(r.name)} <span class="w ${r.weight === 2 ? "x2" : ""}">×${r.weight}</span></h3>
        <p class="small muted"><b>Top marks (9–10):</b> ${esc(r.top)}</p>
        ${r.checks.map((c, i) => { const k = r.id + ":" + i; return `<label class="check"><input type="checkbox" data-action="rub-tick" data-k="${k}" ${rubric.ticks[k] ? "checked" : ""}> <span>${esc(c)}</span></label>`; }).join("")}
      </div>
      <div><label class="small muted" for="sc-${r.id}">Score</label><br>
        <select class="score-sel" id="sc-${r.id}" data-action="rub-score" data-id="${r.id}">
          <option value="">–</option>${Array.from({ length:10 }, (_, i) => `<option value="${i + 1}" ${Number(rubric.scores[r.id]) === i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}
        </select></div></div></div>`).join("")}</div>`;
}

/* ---------- Reference Sheet Builder ---------- */
function sheetItemsFor(t){
  const groups = [];
  t.subtopics.forEach(s => {
    const items = [];
    s.clashes.forEach((c, i) => items.push({ id:`cl:${t.id}:${s.id}:${i}`, type:"clash", s, c }));
    s.evidence.forEach((e, i) => items.push({ id:`ev:${t.id}:${s.id}:${i}`, type:"ev", s, e }));
    groups.push({ s, items });
  });
  return groups;
}
function lookupItem(t, id){
  const [type, , sid, i] = id.split(":"); const s = t.subtopics.find(x => x.id === sid); if (!s) return null;
  if (type === "cl"){ const c = s.clashes[Number(i)]; return c ? { type:"clash", s, c } : null; }
  const e = s.evidence[Number(i)]; return e ? { type:"ev", s, e } : null;
}
function paperHTML(t){
  const sh = sheetFor(t);
  const items = sh.items.map(id => lookupItem(t, id)).filter(Boolean);
  const clashes = items.filter(x => x.type === "clash"), evs = items.filter(x => x.type === "ev");
  return `<div class="paper" id="paper">
    <h1>Reference Sheet: ${esc(t.label)}, ${esc(t.short)}</h1>
    <p class="res">“${esc(t.resolution)}”</p>
    ${clashes.length ? `<h2>Arguments</h2>${clashes.map(x => `<p class="it"><b>[${esc(x.s.title)}] PRO:</b> ${esc(x.c.pro)} <b>CON:</b> ${esc(x.c.con)}</p>`).join("")}` : ""}
    ${evs.length ? `<h2>Evidence</h2>${evs.map(x => `<p class="it">• ${esc(x.e.claim)} <span class="src">(${esc(x.e.source)})</span>${x.e.tag === "verify" ? " <b>[VERIFY]</b>" : ""}</p>`).join("")}` : ""}
    ${sh.notes.trim() ? `<h2>Notes</h2><p class="note">${esc(sh.notes)}</p>` : ""}
    <h2>AI use</h2><p class="note">${esc(sh.ai)}</p>
  </div>`;
}
function renderSheet(){
  const t = T(), sh = sheetFor(t);
  const groups = sheetItemsFor(t);
  const verifyLeft = sh.items.map(id => lookupItem(t, id)).filter(x => x && x.type === "ev" && x.e.tag === "verify").length;
  return `<div class="no-print"><div class="eyebrow">Practice</div><h1>Reference Sheet Builder</h1>
    <p class="muted">The event allows one typed, two-sided 8.5×11 sheet (bring two copies, one for the judges). Pick the arguments and evidence you want, add notes and your AI-use note, then print. Check the event guide PDF for exact formatting rules.</p></div>
  <div class="sheet-cols">
    <div class="no-print sheet-controls">
      <div class="card">
        <h3>1 · Pick content for ${esc(t.label)}</h3>
        <p class="small muted">Switch topics in the header to build the other sheet. Each topic has its own draft.</p>
        ${groups.map(g => { const n = g.items.filter(x => sh.items.includes(x.id)).length;
          return `<details class="pick-group" ${n ? "open" : ""}><summary>${esc(g.s.title)} ${n ? `<span class="badge ok">${n}</span>` : ""}</summary>
          ${g.items.map(x => `<label class="pick"><input type="checkbox" data-action="sheet-check" data-id="${x.id}" ${sh.items.includes(x.id) ? "checked" : ""}>
            <span>${x.type === "clash" ? `<b>Clash:</b> ${esc(x.c.pro)}` : `<b>Evidence:</b> ${esc(x.e.claim)} ${tagBadge(x.e.tag)}`}</span></label>`).join("")}
          </details>`; }).join("")}
      </div>
      <div class="card">
        <h3>2 · Your notes</h3>
        <textarea data-action="sheet-notes" placeholder="Thesis, key stats you verified, rebuttal reminders…">${esc(sh.notes)}</textarea>
        <h3 style="margin-top:12px">3 · AI-use note (required if you used AI)</h3>
        <textarea data-action="sheet-ai">${esc(sh.ai)}</textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" data-action="print">🖨 Print sheet</button>
          <button class="btn" data-action="sheet-clear">Clear selections</button></div>
      </div>
    </div>
    <div>
      <div class="card no-print" style="margin-bottom:10px">
        <div>Estimated length: <span class="est" id="est">…</span></div>
        <p class="small muted" id="est-note"></p>
        ${verifyLeft ? `<p class="small"><span class="badge verify">${verifyLeft} item${verifyLeft > 1 ? "s" : ""} still tagged VERIFY</span> Check these before printing, then edit the wording in your notes.</p>` : ""}
      </div>
      <div class="paper-wrap" id="paper-wrap">${paperHTML(t)}</div>
    </div>
  </div>`;
}
function estimateSheet(){
  const p = $("#paper"), est = $("#est"), note = $("#est-note");
  if (!p || !est) return;
  const pageH = 10 * 96; // 11in page minus 0.5in margins top and bottom, at 96 px per inch
  const pages = p.scrollHeight / pageH;
  est.textContent = pages.toFixed(1) + " of 2 printed sides";
  est.className = "est " + (pages > 2 ? "bad" : "good");
  note.textContent = pages > 2
    ? "This will likely overflow two sides. Remove some items or shorten your notes."
    : "Fits within one double-sided sheet (estimate; check your print preview).";
}
function refreshPaper(){ const w = $("#paper-wrap"); if (w){ w.innerHTML = paperHTML(T()); estimateSheet(); } }

/* ---------- Search ---------- */
function hl(text, q){
  const safe = esc(text);
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  return safe.replace(re, "<mark>$1</mark>");
}
function snippet(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0 || text.length < 170) return text;
  const start = Math.max(0, i - 60);
  return (start ? "…" : "") + text.slice(start, start + 170) + (start + 170 < text.length ? "…" : "");
}
function renderSearch(q){
  const ql = q.toLowerCase(), hits = [];
  const has = s => String(s).toLowerCase().includes(ql);
  DATA.topics.forEach((t, ti) => t.subtopics.forEach(s => {
    const base = { ti, sub:s.id, where:`${t.label} › ${s.title}` };
    if (has(s.title) || has(s.summary)) hits.push({ ...base, kind:"Subtopic", text: has(s.title) ? s.title : s.summary, anchor:null });
    const L = lessonFor(t, s);
    if (L){
      if (has(stripTags(L.hook)) || has(stripTags(L.tldr))) hits.push({ ...base, kind:"Lesson", text: stripTags(has(stripTags(L.hook)) ? L.hook : L.tldr), anchor:null, tab:"learn" });
      [L.fact, (L.analogy || {}).text].forEach(x => { if (x && has(stripTags(x))) hits.push({ ...base, kind:"Lesson", text:stripTags(x), anchor:null, tab:"learn" }); });
      L.check.forEach(q => { if (has(q.q) || has(q.a)) hits.push({ ...base, kind:"Quick check", text:q.q + " " + q.a, anchor:null, tab:"learn" }); });
      L.sections.forEach((x, i) => { const txt = stripTags(x.h + ": " + (x.p || []).join(" ") + " " + (x.list || []).join(" ")); if (has(txt)) hits.push({ ...base, kind:"Lesson", text:txt, anchor:"lesson-sec-" + i, tab:"learn" }); });
    }
    s.terms.forEach(x => { if (has(x.t) || has(x.d)) hits.push({ ...base, kind:"Key term", text:x.t + ": " + x.d, anchor:"terms" }); });
    s.clashes.forEach((c, i) => {
      const f = [c.pro, c.proEv, c.con, c.conEv, c.proCounter, c.conCounter].find(has);
      if (f) hits.push({ ...base, kind:`Clash ${i + 1}`, text:f, anchor:"clash-" + i });
    });
    ["pro", "con"].forEach(sd => s.crossEx[sd].forEach((x, i) => {
      const f = [x.q, x.ifSay, x.then].find(has);
      if (f) hits.push({ ...base, kind:`Cross-ex (${SIDE(sd)} asks)`, text:f, anchor:`xq-${sd}-${i}` });
    }));
    s.evidence.forEach((e, i) => { if (has(e.claim) || has(e.source)) hits.push({ ...base, kind:"Evidence", text:e.claim + " (" + e.source + ")", anchor:"ev-" + i }); });
  }));
  let h = `<div class="eyebrow">Search</div><h1>Results for “${esc(q)}”</h1>
    <p class="muted">${hits.length} match${hits.length === 1 ? "" : "es"} across both topics. <button class="btn mini" data-action="clear-search">Clear search</button></p>`;
  if (!hits.length) return h + `<div class="card"><p>No matches. Try a shorter word, such as “debris”, “ISA” or “cobalt”.</p></div>`;
  return h + hits.slice(0, 80).map(x => `<button class="hit" data-action="nav" data-ti="${x.ti}" data-sub="${esc(x.sub)}" data-anchor="${x.anchor || ""}" data-tab="${x.tab || "prep"}">
      <div class="where">${esc(x.where)} · ${esc(x.kind)}</div><div>${hl(snippet(x.text, q), q)}</div></button>`).join("");
}

/* ---------- Menu (mobile) ---------- */
function closeMenu(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
function toggleMenu(){ const open = !$("#sidebar").classList.contains("open"); $("#sidebar").classList.toggle("open", open); $("#scrim").classList.toggle("show", open); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  switch (a){
    case "menu": toggleMenu(); break;
    case "go": go(el.dataset.view, el.dataset.sub !== undefined ? el.dataset.sub : state.sub, null, el.dataset.tab); break;
    case "topic": state.topic = Number(el.dataset.i); if (state.view === "sub" || state.view === "primer" || state.view === "overview") state.view = readDone[T().id + "|__primer"] ? "overview" : "primer"; save(); render(); window.scrollTo(0, 0); break;
    case "side": state.side = el.dataset.side; save(); render(); break;
    case "theme": state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto"; store.set("theme", state.theme); applyTheme(); break;
    case "review": { const t = T(), s = findSub(state.topic, el.dataset.sub), k = rkey(t, s);
      if (reviewed[k]) delete reviewed[k]; else reviewed[k] = true; store.set("reviewed", reviewed); render(); break; }
    case "sheet-toggle": { const sh = sheetFor(T()), id = el.dataset.id, i = sh.items.indexOf(id);
      if (i >= 0) sh.items.splice(i, 1); else sh.items.push(id); saveSheets();
      el.classList.toggle("on", i < 0); el.textContent = i < 0 ? "✓ On sheet" : (id.startsWith("ev") ? "+ Sheet" : "+ Add to sheet"); break; }
    case "sheet-clear": sheetFor(T()).items = []; saveSheets(); render(); break;
    case "print": window.print(); break;
    case "sim-draw": simDraw(); break;
    case "sim-toggle": simToggle(); break;
    case "sim-skip": simSkip(); break;
    case "sim-reset": simReset(); break;
    case "sim-new": simNew(); break;
    case "fc-flip": fcFlip(); break;
    case "fc-got": fcAnswer(true); break;
    case "fc-again": fcAnswer(false); break;
    case "fc-shuffle": fcInit(true); render(); break;
    case "fc-reset": if (confirm("Reset flashcard progress for this deck?")){ buildDeck(state.scope).forEach(c => delete cardProg[c.id]); store.set("cards", cardProg); fcInit(false); render(); } break;
    case "fc-scope": state.scope = el.dataset.scope; store.set("fcScope", state.scope); fc = null; render(); break;
    case "rub-save": rubric.history.push({ date:new Date().toLocaleDateString(), topic:T().short, side:state.side, total:rubricTotal() });
      rubric.history = rubric.history.slice(-20); store.set("rubric", rubric); render(); break;
    case "rub-clear": rubric.scores = {}; rubric.ticks = {}; store.set("rubric", rubric); render(); break;
    case "clear-search": state.query = ""; $("#search").value = ""; render(); break;
    case "pt-toggle": ptToggle(el.dataset.key, Number(el.dataset.total)); break;
    case "pt-reset": ptReset(el.dataset.key, Number(el.dataset.total)); break;
    case "sp-read": spRead = el.dataset.on === "1"; render(); window.scrollTo(0, 0); break;
    case "nav": state.topic = Number(el.dataset.ti); go("sub", el.dataset.sub, el.dataset.anchor || null, el.dataset.tab); break;
    case "tab": state.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); break;
    case "lesson-done": { const s = findSub(state.topic, el.dataset.sub); readDone[rkey(T(), s)] = true; store.set("read", readDone); go("sub", s.id, null, "prep"); break; }
    case "primer-done": readDone[T().id + "|__primer"] = true; store.set("read", readDone); go("sub", el.dataset.sub, null, "learn"); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.action; if (!a) return;
  if (a === "rub-tick"){ if (el.checked) rubric.ticks[el.dataset.k] = true; else delete rubric.ticks[el.dataset.k]; store.set("rubric", rubric); }
  if (a === "rub-score"){ if (el.value) rubric.scores[el.dataset.id] = Number(el.value); else delete rubric.scores[el.dataset.id]; store.set("rubric", rubric); render(); }
  if (a === "sp-block"){ const t = T(), sel = spSelected(t, state.side), i = sel.indexOf(el.dataset.id);
    if (el.checked && i < 0) sel.push(el.dataset.id); if (!el.checked && i >= 0) sel.splice(i, 1);
    const order = SPEECHES[t.id][state.side].rebuttal.blocks.map(b => b.id); sel.sort((x, y) => order.indexOf(x) - order.indexOf(y));
    store.set("spSel", spSel); render(); return; }
  if (a === "sheet-check"){ const sh = sheetFor(T()), id = el.dataset.id, i = sh.items.indexOf(id);
    if (el.checked && i < 0) sh.items.push(id); if (!el.checked && i >= 0) sh.items.splice(i, 1); saveSheets(); refreshPaper(); }
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset && el.dataset.action;
  if (a === "sheet-notes" || a === "sheet-ai"){ const sh = sheetFor(T()); sh[a === "sheet-notes" ? "notes" : "ai"] = el.value; saveSheets(); refreshPaper(); }
});
let searchTimer = null;
$("#search").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.query = e.target.value; render(); }, 150); });
$("#search").addEventListener("keydown", e => { if (e.key === "Escape"){ e.target.value = ""; state.query = ""; e.target.blur(); render(); } });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); return; }
  if (state.query) return;
  if (state.view === "cards"){
    if (e.key === "ArrowRight"){ e.preventDefault(); fcAnswer(true); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); fcAnswer(false); }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "Enter"){ e.preventDefault(); fcFlip(); }
  } else if (state.view === "sim" && (e.key === " " || e.code === "Space")){
    e.preventDefault(); if (sim.drawn) simToggle(); else simDraw();
  }
});
window.addEventListener("resize", () => { document.documentElement.style.setProperty("--hh", $("#hdr").offsetHeight + "px"); });
setInterval(() => { tick(); ptTick(); }, 200);

/* ---------- Boot ---------- */
applyTheme();
render();
</script>
